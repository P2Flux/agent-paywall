<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:1544px;height:500px;background:#0B0C12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;overflow:hidden;position:relative}
.glow{position:absolute;right:-180px;top:-220px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#6D5FFF55 0,#6D5FFF00 65%)}

.right{position:relative;display:flex;flex-direction:column;gap:20px;margin-left:40px}
.row{display:flex;align-items:center;gap:18px;font:600 27px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip{padding:16px 26px;border-radius:14px;background:#171923;border:1px solid #2a2d3d;min-width:440px}
.who{width:96px;white-space:nowrap;font:600 20px system-ui,sans-serif;color:#8d92a8;text-align:right}
.a{color:#ffb454}.b{color:#a79dff}.c{color:#57d38c}
</style>

<p>Get paid in USDC when AI agents read your site. People see it as always.</p>
</div>
